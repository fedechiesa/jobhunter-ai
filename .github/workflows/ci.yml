name: JobHunter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -c backend/constraints.txt -e './backend[dev]'
      - name: Generate isolated local configuration
        run: python scripts/setup_env.py
      - name: Start PostgreSQL
        run: docker compose --profile test up -d --wait
      - name: Migrations and backend checks
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini check
          python -m ruff check backend scripts
          python -m ruff format --check backend scripts
          python -m pip check
          python -m pytest backend
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run format:check
          npm run build
          npm audit
      - name: Stop containers
        if: always()
        run: docker compose --profile test down
